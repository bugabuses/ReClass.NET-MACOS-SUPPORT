[project]
name = "reclass-mcp"
version = "0.1.0"
description = "MCP bridge for ReClass.NET"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
reclass-mcp = "reclass_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reclass_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: exercises a live ReClass.NET process (requires ~/.reclass-mcp.json)",
]
